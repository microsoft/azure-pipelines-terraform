---
name: Unit Testing
on:
  pull_request:
    branches:
      - main
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test-v4:
    name: Unit Test V4 Task
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Run Unit Tests
      run: |
        cd Tasks/TerraformTask/TerraformTaskV4
        npm install -include=dev
        npm test
  unit-test-v5:
    name: Unit Test V5 Task
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Run Unit Tests
      run: |
        cd Tasks/TerraformTask/TerraformTaskV5
        npm install -include=dev
        npm test
  unit-test-plan-view:
    name: Unit Test Plan View
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Run Unit Tests
      run: |
        cd views/terraform-plan
        npm install -include=dev
        npm test
    # No task tsconfig covers the view, so this is where type errors get caught.
    - name: Build
      run: |
        cd views/terraform-plan
        npm run build
