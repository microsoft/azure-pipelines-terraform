---
name: Unit Testing for OpenTofuTaskV1
on:
  pull_request:
    branches:
      - main
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  unit-test-v1:
    name: Unit Test V4 Task
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Run Unit Tests
      run: |
        cd Tasks/OpenTofuTask/OpenTofuTaskV1
        npm install -include=dev
        npm test
