variables:
- name: major
  value: '0'
- name: minor
  value: '1'
- name: extensionName
  value: 'OpenTofu'
- name: marketplaceServiceConnection
  value: 'Azure Marketplace cotality'
- name: publisherId
  value: 'cotality'
- name: publicExtensionName
  value: "OpenTofu"
- name: extensionId
  value: "custom-opentofu-tasks"

name: $(major).$(minor)$(rev:.r)

trigger:
  branches:
    include:
    - main

pr: none

resources:
  repositories:
    - repository: pipeline-templates
      type: git
      name: 'DevLabs Extensions/pipeline-templates'
      ref: main

stages:
- stage: 'Build'
  jobs:
  - job: 'BuildPack'
    displayName: "Build and package"
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - template: build.yml@pipeline-templates
    - template: package.yml@pipeline-templates
      parameters:
        extensionName: $(extensionName)
        outputPath: 'out'
        rootPath: './build'

